packages:
  - 'apps/*'
  - 'packages/*'

# Supply-chain maturity gate. Set to 10080 (7d) once this lockfile ages past the
# cutoff; left at 0 after an intentional upgrade-to-latest (2026-07-31) so
# scripts/`pnpm install` are not blocked by freshly published versions.
minimumReleaseAge: 0
# Always allow fast @mastra/* iteration (Schedules / core API churn).
minimumReleaseAgeExclude:
  - '@mastra/*'

overrides:
  ioredis: ^5.11.1
  # Mastra CJS uses __toESM(require(slugify), 1); pure-ESM namespace breaks .default.
  # Force our CJS-callable workspace shim (packages/slugify-cjs).
  '@sindresorhus/slugify': workspace:*
  # Single Codemirror runtime — duplicate @codemirror/state breaks Extension instanceof checks
  # when @mdxeditor/editor and @uiw/react-codemirror resolve different copies.
  '@codemirror/state': ^6.7.1
  '@codemirror/view': ^6.43.7
  '@codemirror/language': ^6.12.3

catalog:
  # TS 7 / ESLint 10 are latest on npm but break eslint-config-next peers
  # (typescript-eslint <6.1.0, eslint-plugin-* ^9). Use newest compatible.
  typescript: ^6.0.3
  "@types/node": ^26.1.2
  eslint: ^9.39.5
  prettier: ^3.9.6
  "@ai-sdk/openai": ^4.0.25
  drizzle-orm: ^0.45.2
  ioredis: ^5.11.1
  zod: ^4.4.3

allowBuilds:
  esbuild: true
  sharp: true
  msgpackr-extract: true
  protobufjs: true
  unrs-resolver: true
  bufferutil: false
  '@google/genai': false
  agent-browser: false
  edgedriver: false
  geckodriver: false
  koffi: false
  onnxruntime-node: false
