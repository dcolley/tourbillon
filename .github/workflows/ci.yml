name: CI

# S261-S2: the root type-check gate (`pnpm -r type-check`) is what catches type
# regressions across packages — apps/web tsc + the now-covered packages/mastra
# (baseline-gated, see packages/mastra/type-check.baseline). Before this workflow the
# gate only ever ran on developer machines, so type regressions reached review.
# S328-S4: the `unit-tests` job below runs the service-FREE subset (shared, scheduler
# minus packages/scheduler/scripts/run-unit-tests.mjs SERVICE_BOUND, apps/web lib/harness and lib/chat-send-key.test.ts (S305-S1)).
# Suites that need Postgres/Redis stay a local/pre-merge concern until an infra recipe exists.
# S316-S4 / S322-S4: shared + scheduler are linted alongside company-computer, so the
# harness adapters (hermes-adapter, opencode-adapter, wake-runner) are no longer a blind spot.
# Both are pinned by packages/scheduler/src/ci-coverage-s316-s4-s328-s4.test.ts.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-type-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # packageManager pin in package.json resolves the actual version; this is
        # only the bootstrap for the `pnpm` command itself.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      # S282-S5: packages/company-computer lint gate (eslint.config.mjs in that package).
      # Scoped to the package; apps/web lint is not yet CI-clean so it stays local.
      - run: pnpm --filter @tourbillon/company-computer lint
      # S316-S4 / S322-S4: shared + scheduler lint gate (eslint.config.mjs in each package).
      - run: pnpm --filter @tourbillon/shared lint
      - run: pnpm --filter @tourbillon/scheduler lint

  # S328-S4: unit tests that need no Postgres/Redis. DATABASE_URL/REDIS_URL point at a closed
  # port so a suite that silently grows a service dependency fails here instead of passing.
  unit-tests:
    runs-on: ubuntu-latest
    # No --test-force-exit in these scripts (it can drop files while exiting 0); an open handle
    # surfaces here as a timeout instead.
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:1/unused
      REDIS_URL: redis://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tourbillon/shared test:unit
      - run: pnpm --filter @tourbillon/scheduler test:unit
      - run: pnpm --filter web test:harness

  # #114: real-Postgres evidence for the run-id header fix. Disposable service container only
  # (no live DB, no credentials, no deploy); schema applied with the repo's normal migration
  # runner to that throwaway database. Pinned file + test names: apps/web/lib/auth/run-id-header-114.pg-manifest.json.
  pg-114-run-id-header:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tb114
          POSTGRES_PASSWORD: tb114
          POSTGRES_DB: tb114_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tb114 -d tb114_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://tb114:tb114@127.0.0.1:5432/tb114_test
      REDIS_URL: redis://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tourbillon/db migrate
      - run: node scripts/run-pg-114-tests.mjs
        working-directory: apps/web

  # Task-notification certification (v2.1): disposable pgvector/pg16 + Redis 7,
  # existing drizzle journal only (no new migration), exact pinned B command.
  task-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tourbillon_tn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tourbillon_tn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tourbillon_tn
      REDIS_URL: redis://127.0.0.1:6379
      TN_DISPOSABLE: "1"
      TOURBILLON_AGENT_TOKEN_SECRET: ci-task-notification-token-secret-not-used-live
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Task-notification certification
        working-directory: apps/web
        run: node scripts/run-task-notification-tests.mjs
